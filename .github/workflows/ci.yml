name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv nodejs npm
      - name: Install Python dev deps
        run: |
          python -m pip install -U pip
          pip install pytest fastapi[all] ruff mypy yamllint
      - name: Install JS deps
        run: |
          npm ci --no-audit || true
      - name: Run ruff
        run: ruff check --select E,F,W
      - name: Run tests
        run: pytest -q
      - name: Run yamllint
        run: yamllint -c .yamllint.yml .
