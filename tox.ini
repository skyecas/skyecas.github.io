[tox]
min_version = 4.0
env_list = railplanner-lint, railplanner-test
skipsdist = true

[testenv:railplanner-lint]
description = Run Rail Planner linting checks
changedir = assets/py/Rail Planner
skip_install = true
deps =
    pyyaml>=6
    requests>=2
commands =
    python -c "import py_compile; [py_compile.compile(f, doraise=True) for f in 'time_util.py geo.py emissions.py rail_planner.py truth/snapshot.py curation/state.py narrative/blog.py generate_blog.py ui/server.py ui/post_parser.py'.split()]; print('All Rail Planner files compile OK')"

[testenv:railplanner-test]
description = Run Rail Planner tests
changedir = assets/py/Rail Planner
skip_install = true
deps =
    pytest>=8
    pyyaml>=6
    requests>=2
commands = python -m pytest {posargs:tests/}
